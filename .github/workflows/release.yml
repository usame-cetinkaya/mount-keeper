name: Release

on:
  push:
    tags: ["*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Test
        run: swift test

      - name: Build
        run: VERSION="$GITHUB_REF_NAME" scripts/build.sh

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.dmg --title "$GITHUB_REF_NAME" --generate-notes
